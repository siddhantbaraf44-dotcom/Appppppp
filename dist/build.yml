name: Build Ice APK

# Works in two situations, no extra setup:
#   1. The repository contains the Ice project (settings.gradle.kts at the root)  -> builds it.
#   2. The repository contains an Ice ZIP archive (because you uploaded the ZIP as-is,
#      which GitHub does not extract)                                            -> unpacks it and builds it.
#
# Every run produces the download "Ice-debug-apk" with Ice-<run-number>.apk inside.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find the project (or unpack the uploaded ZIP)
        id: locate
        run: |
          set -e
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "Project found at the repository root."
            echo "project_dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP=$(find . -maxdepth 3 -iname "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::No Gradle project and no ZIP archive found in the repository."
            exit 1
          fi
          echo "Unpacking $ZIP"
          mkdir -p work
          unzip -q -o "$ZIP" -d work
          DIR=$(find work -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$DIR" ]; then
            echo "::error::No settings.gradle.kts inside $ZIP"
            exit 1
          fi
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Download uBlock Origin (built-in ad blocker)
        run: |
          set -e
          DEST="${{ steps.locate.outputs.project_dir }}/app/src/main/assets/extensions/ublock"
          mkdir -p "$DEST"
          curl -fL --retry 3 -o ublock.xpi \
            "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"
          unzip -q -o ublock.xpi -d "$DEST"
          test -f "$DEST/manifest.json" && echo "uBlock Origin is ready"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find "${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug" -name "*.apk" \
            -exec cp {} "out/Ice-${{ github.run_number }}.apk" \;
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ice-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
